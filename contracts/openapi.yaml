openapi: 3.1.0
info:
  title: Rabdan AI Proctoring API
  version: 0.1.0-draft
  description: >
    API contract for the Rabdan AI Proctoring admin dashboard.

    STATUS: DRAFT. This is the frontend team's proposed contract, derived from
    the implemented UI. It is the single source of truth both teams build to.
    Backend implements these endpoints; frontend generates its client types from
    this file. Anything marked `TODO`/`open question` is not yet agreed — see
    contracts/README.md.

    Design decisions already made:
      - Backend OWNS violation detection (runs/integrates the CV pipeline,
        persists incidents, serves them here).
      - Live active-exam updates use WebSocket/SSE (see the /realtime section),
        layered on top of these REST resources.
      - Exams come from the SIS (Student Information System) — this backend
        ingests them, it does not own their lifecycle.
      - Locations and Cameras are admin-managed via the /settings endpoints.
        Each Location carries a `code` field that must match the identifier
        the SIS sends for that room. AI camera activation for an exam is
        derived server-side as:
            `SELECT * FROM cameras WHERE locationId = exam.locationId`
        If an incoming SIS exam's room identifier doesn't match any known
        Location.code, the exam is stored with `locationId = null` and no
        cameras are activated for it until an admin adds a matching Location.

servers:
  - url: https://api.rabdan.example/v1
    description: Production (placeholder — backend to confirm)
  - url: http://localhost:8080/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Exams
  - name: Incidents
  - name: Export
  - name: Settings

paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a proctor/admin and issue a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Exams
  # ---------------------------------------------------------------------------
  /exams:
    get:
      tags: [Exams]
      summary: List exams (active or past)
      description: >
        Feeds the exam list page. Frontend requests one status at a time
        (Active tab / Past tab). `open` and `total` are incident counts the UI
        shows as badges.
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [active, past]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of exam summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /exams/{examId}:
    get:
      tags: [Exams]
      summary: Get a single exam's detail/metadata
      description: Feeds the workspace header (title, location, window, session state, student count).
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Exam detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Incidents
  # ---------------------------------------------------------------------------
  /exams/{examId}/incidents:
    get:
      tags: [Incidents]
      summary: List incidents for an exam
      description: >
        Feeds the incidents data table in the exam workspace. The frontend does
        its own client-side sort/filter/paginate today, so returning the full
        set per exam is acceptable initially; server-side pagination params are
        provided for scale.
      parameters:
        - $ref: '#/components/parameters/ExamId'
        - name: status
          in: query
          required: false
          description: Optional filter by review status.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IncidentStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of incidents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPage'
        '404':
          $ref: '#/components/responses/NotFound'

  /exams/{examId}/incidents/{incidentId}:
    get:
      tags: [Incidents]
      summary: Get a single incident with evidence
      description: >
        Feeds the incident detail dialog, including the camera-still evidence
        image reference and any richer metadata not needed in the table.
      parameters:
        - $ref: '#/components/parameters/ExamId'
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Incident detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /exams/{examId}/incidents/{incidentId}/status:
    patch:
      tags: [Incidents]
      summary: Change one incident's review status
      description: >
        Confirm / discard / restore / reopen. The UI transitions:
        open -> confirmed | discarded; confirmed -> discarded; discarded -> open (restore);
        (past) confirmed/discarded -> open (reopen). Backend should record who
        changed it and when for the audit trail.
      parameters:
        - $ref: '#/components/parameters/ExamId'
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentStatusUpdate'
      responses:
        '200':
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Illegal status transition (e.g. editing a finalized past exam).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exams/{examId}/incidents:status:
    patch:
      tags: [Incidents]
      summary: Bulk-change status for multiple incidents
      description: Feeds the bulk Confirm / Discard actions on selected table rows.
      parameters:
        - $ref: '#/components/parameters/ExamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIncidentStatusUpdate'
      responses:
        '200':
          description: Updated incidents
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incident'
                required: [updated]
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Export
  # ---------------------------------------------------------------------------
  /exams/{examId}/incidents/{incidentId}/proof:
    post:
      tags: [Export]
      summary: Generate a proof export for a single incident
      description: >
        Backing the "Export proof" action in the detail dialog. Returns a
        reference to a generated artifact (e.g. a signed PDF). Generation may be
        async — see the `status` field.
      parameters:
        - $ref: '#/components/parameters/ExamId'
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '202':
          description: Export accepted/generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'

  /exams/{examId}/incidents:export:
    post:
      tags: [Export]
      summary: Export a selection of incidents as a table
      description: Backing the "Export selected / Export table" action.
      parameters:
        - $ref: '#/components/parameters/ExamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                incidentIds:
                  type: array
                  items: { type: string }
                  description: Empty/omitted means export the full filtered set (TODO confirm).
                format:
                  type: string
                  enum: [csv, xlsx, pdf]
                  default: csv
              required: [format]
      responses:
        '202':
          description: Export accepted/generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'

  # ---------------------------------------------------------------------------
  # Settings — Locations & Cameras (admin-managed)
  # ---------------------------------------------------------------------------
  /settings/locations:
    get:
      tags: [Settings]
      summary: List locations
      responses:
        '200':
          description: All locations, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Location' }
    post:
      tags: [Settings]
      summary: Create a location
      description: >
        Fails with 409 when a location with the same `code` or `name` already
        exists (case-insensitive dedupe).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationForCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '409':
          description: Duplicate `code` or `name`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /settings/locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    put:
      tags: [Settings]
      summary: Update a location
      description: >
        Same dedupe rules as create. Editing `code` is allowed but may orphan
        exams whose SIS room identifier no longer matches — callers should
        confirm with the operator before touching it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationForUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate `code` or `name`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Settings]
      summary: Delete a location
      description: >
        Fails with 409 when one or more cameras still reference this location.
        Exams that reference the location are NOT considered blockers — the
        backend must handle orphaned exams gracefully (AI activation simply
        no-ops when `Exam.locationId` is unresolved).
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Location is still referenced by one or more cameras.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /settings/cameras:
    get:
      tags: [Settings]
      summary: List cameras
      responses:
        '200':
          description: All cameras, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Camera' }
    post:
      tags: [Settings]
      summary: Create a camera
      description: >
        Camera names must be unique within a Location. Fails with 409 on
        duplicate `(locationId, name)`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CameraForCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Camera' }
        '409':
          description: Duplicate camera name in this location.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /settings/cameras/{cameraId}:
    parameters:
      - $ref: '#/components/parameters/CameraId'
    put:
      tags: [Settings]
      summary: Update a camera
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CameraForUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Camera' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate camera name in this location.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Settings]
      summary: Delete a camera
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ExamId:
      name: examId
      in: path
      required: true
      schema: { type: string }
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { type: string }
    CameraId:
      name: cameraId
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # --- Auth ---------------------------------------------------------------
    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]
      description: TODO confirm auth mechanism (password vs SSO/OIDC).

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: Bearer token (JWT). }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
      required: [token, user]

    User:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        picture: { type: string, nullable: true, description: Avatar URL, may be empty. }
        roles:
          type: array
          items: { type: string }
          description: TODO define roles (e.g. proctor, admin) and their permissions.
      required: [userId, name, email]

    # --- Exams --------------------------------------------------------------
    ExamStatus:
      type: string
      enum: [active, past]

    ExamSummary:
      type: object
      description: >
        Card shown in the exam list. Mirrors the UI's ExamSummary. Exams
        originate in the SIS; this backend ingests and serves them.
      properties:
        id: { type: string }
        title: { type: string, example: 'Calculus II · Final' }
        locationId:
          type: string
          nullable: true
          description: >
            FK to `Location.id`. Null when the SIS's room identifier for this
            exam does not match any known `Location.code` — the exam is still
            surfaced, but no cameras are activated for it until an admin adds
            a matching Location.
        locationName:
          type: string
          nullable: true
          description: >
            Denormalized `Location.name` for display in the UI. Backend fills
            it from the linked Location; null when `locationId` is null.
        status: { $ref: '#/components/schemas/ExamStatus' }
        live:
          type: boolean
          description: True while a session is in progress (active exams only).
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        totalIncidents:
          type: integer
          description: UI `total` badge.
        openIncidents:
          type: integer
          description: UI `open` badge.
      required: [id, title, locationId, locationName, status, startsAt, endsAt, totalIncidents, openIncidents]

    ExamDetail:
      allOf:
        - $ref: '#/components/schemas/ExamSummary'
        - type: object
          description: >
            NOTE: no `cameras` array. Cameras for an exam are derived
            server-side from `locationId` — see the AI activation rule in the
            top-level API description.
          properties:
            studentCount:
              type: integer
              description: UI header "students" count.
          required: [studentCount]

    Camera:
      type: object
      description: >
        A physical camera registered by an admin under a specific Location.
        Camera names are predefined by the site and not discovered dynamically.
      properties:
        id: { type: string, example: 'cam-loc-abc-123' }
        name:
          type: string
          example: 'cam-04'
          description: Immutable-in-spirit identifier of the physical camera.
        locationId:
          type: string
          description: FK to `Location.id`.
        createdAt: { type: string, format: date-time }
      required: [id, name, locationId, createdAt]

    Location:
      type: object
      description: >
        A physical room/hall that hosts exams. Admin-managed via the
        /settings/locations endpoints. `code` is the stable join key against
        the identifier the SIS sends per exam.
      properties:
        id: { type: string, example: 'loc-abc-123' }
        code:
          type: string
          example: 'HALL_B'
          description: >
            Stable identifier admins agree with the SIS. Backend joins on this
            field to resolve `Exam.locationId`. Case-sensitive when matched
            against SIS strings; unique within the tenant (case-insensitive
            dedupe on write).
        name:
          type: string
          example: 'Hall B'
          description: Display name. Free to rename without affecting the join.
        description:
          type: string
          nullable: true
          description: Optional admin-authored short note.
        createdAt: { type: string, format: date-time }
      required: [id, code, name, createdAt]

    LocationForCreate:
      type: object
      properties:
        code: { type: string, example: 'HALL_B' }
        name: { type: string, example: 'Hall B' }
        description: { type: string, nullable: true }
      required: [code, name]

    LocationForUpdate:
      $ref: '#/components/schemas/LocationForCreate'

    CameraForCreate:
      type: object
      properties:
        name: { type: string, example: 'cam-04' }
        locationId: { type: string }
      required: [name, locationId]

    CameraForUpdate:
      $ref: '#/components/schemas/CameraForCreate'

    # --- Incidents ----------------------------------------------------------
    ViolationType:
      type: string
      enum: [phone, adjacent]
      description: >
        `phone` = phone use (1 subject). `adjacent` = adjacent-student
        interaction (2 subjects). Extensible — backend may add types; frontend
        renders unknown types generically.

    IncidentStatus:
      type: string
      enum: [open, confirmed, discarded]

    Subject:
      type: object
      description: >
        A person implicated in an incident. `phone` has 1 subject; `adjacent`
        has 2. A null studentId + null name means "unidentified" (the CV
        pipeline saw a person it could not resolve to a roster student).
      properties:
        studentId: { type: string, nullable: true }
        name: { type: string, nullable: true }
      required: [studentId, name]

    Incident:
      type: object
      description: >
        Row in the incidents table. NOTE: differs from the current UI mock in
        that `occurredAt` is a real timestamp (UI formats it) and `subjects` are
        objects, not bare name strings.
      properties:
        id: { type: string, example: 'INC-04817' }
        examId: { type: string }
        type: { $ref: '#/components/schemas/ViolationType' }
        occurredAt:
          type: string
          format: date-time
          description: Detection time. UI renders as HH:MM:SS.
        camera: { $ref: '#/components/schemas/Camera' }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/Subject' }
          minItems: 1
          maxItems: 2
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: >
            CV model confidence 0..1. Null when not applicable. UI flags < 0.70
            as low-confidence.
        status: { $ref: '#/components/schemas/IncidentStatus' }
        reviewedBy: { type: string, nullable: true, description: userId of last reviewer. }
        reviewedAt: { type: string, format: date-time, nullable: true }
      required: [id, examId, type, occurredAt, camera, subjects, confidence, status]

    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          properties:
            evidence:
              type: array
              description: Camera stills / clips backing the incident (shown in the detail dialog).
              items: { $ref: '#/components/schemas/Evidence' }
          required: [evidence]

    Evidence:
      type: object
      properties:
        kind: { type: string, enum: [still, clip] }
        url: { type: string, description: Signed, time-limited URL to the media. }
        capturedAt: { type: string, format: date-time }
      required: [kind, url]

    IncidentStatusUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/IncidentStatus' }
      required: [status]

    BulkIncidentStatusUpdate:
      type: object
      properties:
        incidentIds:
          type: array
          items: { type: string }
          minItems: 1
        status: { $ref: '#/components/schemas/IncidentStatus' }
      required: [incidentIds, status]

    # --- Export -------------------------------------------------------------
    ExportJob:
      type: object
      properties:
        jobId: { type: string }
        status: { type: string, enum: [pending, ready, failed] }
        downloadUrl:
          type: string
          nullable: true
          description: Populated when status = ready. TODO confirm sync vs async.
      required: [jobId, status]

    # --- Pagination ---------------------------------------------------------
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
      required: [page, pageSize, total]

    ExamSummaryPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ExamSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
      required: [data, meta]

    IncidentPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        meta: { $ref: '#/components/schemas/PageMeta' }
      required: [data, meta]

    # --- Errors -------------------------------------------------------------
    Error:
      type: object
      description: >
        Error envelope. The frontend httpClient throws `error.response.data`,
        so this shape is what UI code catches. `message` is currently the only
        field the UI reads.
      properties:
        message: { type: string }
        code: { type: string, nullable: true }
        details:
          type: object
          additionalProperties: true
          nullable: true
      required: [message]
